name: Go
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.21'
          
      - name: Build
        run: go build ./cmd/main.go
          
      - name: Test
        run: go test ./...
          
      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.52